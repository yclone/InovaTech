# Configuração para testes de integração com aplicação local
appUrl=http://localhost:5000/
appUrlEmail=http://localhost:5000/
useProxy=false
proxyUrl=localhost
proxyPort=8080

# STS Fake - não será usado pois o StsTokenFake detectará automaticamente
UrlSts=http://localhost:8080/mock/sts/token

# Headers mock para testes
x-getnet-flowID=mock-flow-id-tests
x-getnet-correlationID=mock-correlation-id-tests

# Credenciais mock para testes
client_id=test-client-id-12345
client_secret=test-client-secret-67890

# Configurações do Spring Boot para testes
spring.profiles.active=test
logging.level.org.springframework=WARN
logging.level.helpers=DEBUG