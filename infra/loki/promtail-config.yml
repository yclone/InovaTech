server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ========================================
  # Spring Boot Backend Logs
  # ========================================
  - job_name: spring-boot-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot
          application: inovatech-backend
          environment: dev
          tier: backend
          __path__: /logs/spring-boot/backend*.log
    pipeline_stages:
      # Parse JSON logs do Spring Boot (com Logback)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            thread: thread
            logger: logger_name
            message: message
            trace_id: traceId
            span_id: spanId
            application: application
            tier: tier
      # Extrair informações adicionais
      - labels:
          level:
          application:
          tier:
          trace_id:
      # Timestamp parsing
      - timestamp:
          source: timestamp
          format: RFC3339
      # Output final
      - output:
          source: message

  # ========================================
  # Frontend Logs (recebidos via backend)
  # ========================================
  - job_name: frontend-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
          application: inovatech-frontend
          environment: dev
          tier: frontend
          __path__: /logs/spring-boot/frontend*.log
    pipeline_stages:
      # Parse do JSON externo
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            tier: tier
            frontend_context: context
            frontend_url: url
            user_agent: userAgent
      # Parse do FRONTEND_LOG interno (nested JSON)
      - match:
          selector: '{job="frontend"}'
          stages:
            - regex:
                expression: 'FRONTEND_LOG: (?P<frontend_json>.*)'
            - json:
                source: frontend_json
                expressions:
                  frontend_timestamp: timestamp
                  frontend_level: level
                  frontend_context: context
                  frontend_message: message
                  frontend_url: url
      # Labels para filtros
      - labels:
          level:
          tier:
          frontend_context:
      # Timestamp do frontend
      - timestamp:
          source: frontend_timestamp
          format: RFC3339
      # Output com mensagem do frontend
      - template:
          source: output
          template: '[{{.frontend_context}}] {{.frontend_message}}'
      - output:
          source: output

  # ========================================
  # Node.js Frontend Logs (será configurado no Módulo 6)
  # ========================================
  - job_name: nodejs-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nodejs
          application: inovatech-frontend
          environment: dev
          __path__: /logs/nodejs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
      - labels:
          level:
          application:
      - timestamp:
          source: timestamp
          format: RFC3339

  # ========================================
  # Logs de sistema (opcional)
  # ========================================
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
