server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ========================================
  # Spring Boot Logs (será configurado no Módulo 2)
  # ========================================
  - job_name: spring-boot-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot
          application: inovatech-backend
          environment: dev
          __path__: /logs/spring-boot/*.log
    pipeline_stages:
      # Parse JSON logs do Spring Boot (com Logback)
      - json:
          expressions:
            timestamp: timestamp
            level: level
            thread: thread
            logger: logger
            message: message
            trace_id: traceId
            span_id: spanId
      # Extrair informações adicionais
      - labels:
          level:
          application:
          trace_id:
      # Timestamp parsing
      - timestamp:
          source: timestamp
          format: RFC3339
      # Output final
      - output:
          source: message

  # ========================================
  # Node.js Frontend Logs (será configurado no Módulo 6)
  # ========================================
  - job_name: nodejs-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: nodejs
          application: inovatech-frontend
          environment: dev
          __path__: /logs/nodejs/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
      - labels:
          level:
          application:
      - timestamp:
          source: timestamp
          format: RFC3339

  # ========================================
  # Logs de sistema (opcional)
  # ========================================
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*.log
